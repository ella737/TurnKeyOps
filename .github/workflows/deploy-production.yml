name: Deploy TurnKeyOps - Production
run-name: Ship production · ${{ inputs.ship-release-id }} · ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      ship-release-id:
        description: Hubbsly Ship deployment or release identifier
        required: true
        type: string
      uat-evidence:
        description: Hubbsly card, URL, or record containing approved UAT evidence
        required: true
        type: string
      rollback-reference:
        description: Previous healthy GitHub run, artifact, or commit
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: turnkeyops-deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Production is main-only. The condition is structural, so a non-main
    # dispatch cannot acquire Azure credentials or enter the reusable workflow.
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      environment-name: production
      aspnetcore-environment: Production
      ship-release-id: ${{ inputs.ship-release-id }}
      uat-evidence: ${{ inputs.uat-evidence }}
      rollback-reference: ${{ inputs.rollback-reference }}
