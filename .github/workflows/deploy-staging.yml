name: Deploy TurnKeyOps - Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: turnkeyops-deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    # Manual runs default to the repository's default branch; keep the branch
    # rule structural so a non-main dispatch cannot acquire Azure credentials.
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      environment-name: staging
      aspnetcore-environment: Staging
      ship-release-id: automatic-staging-${{ github.run_id }}
